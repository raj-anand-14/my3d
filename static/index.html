<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>my3d — image to 3D</title>
<script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
<style>
  body { font-family: system-ui, sans-serif; margin: 0; background: #111; color: #eee; }
  main { max-width: 960px; margin: 0 auto; padding: 24px; }
  .row { display: flex; gap: 16px; flex-wrap: wrap; align-items: end; }
  label { display: flex; flex-direction: column; font-size: 13px; gap: 4px; }
  input[type=number] { width: 90px; }
  button { padding: 10px 18px; font-size: 15px; cursor: pointer; }
  .panes { display: grid; grid-template-columns: 1fr 2fr; gap: 16px; margin-top: 20px; }
  img, model-viewer { width: 100%; height: 420px; background: #222; border-radius: 8px; object-fit: contain; }
  #status { margin-top: 12px; color: #9cf; }
  a { color: #9cf; }
</style>
</head>
<body>
<main>
  <h1>my3d</h1>
  <p>Upload a single-object image. You'll get a 3D mesh (GLB) back.</p>
  <form id="f" class="row">
    <label>Image <input type="file" name="image" accept="image/*" required /></label>
    <label>Seed <input type="number" name="seed" value="42" /></label>
    <label>Steps <input type="number" name="steps" value="50" min="10" max="100" /></label>
    <label>Faces <input type="number" name="faces" value="20000" step="1000" /></label>
    <button type="submit">Generate 3D</button>
  </form>
  <div id="status"></div>
  <div class="panes">
    <img id="preview" alt="" />
    <model-viewer id="viewer" camera-controls auto-rotate shadow-intensity="1"></model-viewer>
  </div>
  <p><a id="dl" hidden download="model.glb">Download GLB</a></p>
</main>
<script>
  const f = document.getElementById('f');
  const status = document.getElementById('status');
  f.image.onchange = () => {
    const file = f.image.files[0];
    if (file) document.getElementById('preview').src = URL.createObjectURL(file);
  };
  f.onsubmit = async (e) => {
    e.preventDefault();
    status.textContent = 'Generating… (about 10–60s depending on your GPU)';
    const t0 = performance.now();
    try {
      const res = await fetch('/generate', { method: 'POST', body: new FormData(f) });
      if (!res.ok) throw new Error(await res.text());
      const url = URL.createObjectURL(await res.blob());
      document.getElementById('viewer').src = url;
      const dl = document.getElementById('dl');
      dl.href = url; dl.hidden = false;
      status.textContent = `Done in ${((performance.now() - t0) / 1000).toFixed(1)}s`;
    } catch (err) {
      status.textContent = 'Error: ' + err.message;
    }
  };
</script>
</body>
</html>
